document.getElementById('calGrid').addEventListener('click', e => {
  const cell = e.target.closest('.cal-cell');
  if (!cell || cell.classList.contains('other')) return;
  const clicked = cell.dataset.date;

  // 清除类目/环比等无关筛选
  filterCategory = null;
  if (compareMode) {
    compareMode = false;
    document.body.classList.remove("period-prev");
    document.getElementById('compareToggle').classList.remove('active');
    document.getElementById('compareBar').style.display = 'none';
    filterPeriod = null;
  }
  document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));

  if (!rangeSelStart) {
    // 第一次点击：记录起始日，等待第二次点击
    rangeSelStart = clicked;
    filterDate = null;
    filterStart = null; filterEnd = null;
    document.getElementById('tfStart').value = '';
    document.getElementById('tfEnd').value = '';
  } else if (rangeSelStart === clicked) {
    // 第二次点击同一天 → 选择当日
    rangeSelStart = null;
    filterDate = clicked;
    filterStart = null; filterEnd = null;
    document.getElementById('tfStart').value = '';
    document.getElementById('tfEnd').value = '';
  } else {
    // 第二次点击不同日期 → 选择两天之间的范围
    const d1 = new Date(rangeSelStart + 'T00:00:00');
    const d2 = new Date(clicked + 'T00:00:00');
    const [startD, endD] = d1 < d2 ? [d1, d2] : [d2, d1];
    const fmtL = dd => {
      const yy = dd.getFullYear();
      const mm = String(dd.getMonth() + 1).padStart(2, '0');
      const day = String(dd.getDate()).padStart(2, '0');
      const hh = String(dd.getHours()).padStart(2, '0');
      const mi = String(dd.getMinutes()).padStart(2, '0');
      return `${yy}-${mm}-${day}T${hh}:${mi}`;
    };
    const startStr = fmtL(new Date(startD.getFullYear(), startD.getMonth(), startD.getDate(), 0, 0, 0));
    const endStr = fmtL(new Date(endD.getFullYear(), endD.getMonth(), endD.getDate(), 23, 59, 59));
    rangeSelStart = null;
    filterDate = null;
    filterStart = startStr;
    filterEnd = endStr;
    document.getElementById('tfStart').value = startStr;
    document.getElementById('tfEnd').value = endStr;
  }
  renderCalendar();
  renderRecords();
  renderStats();
});

// ═══════════════════════════════════════
// ⋯ 导出范围选择弹窗
// ═══════════════════════════════════════

// 根据快捷选项计算 [start, end] 时间戳（ms），返回 null 表示全部
function getExportRange(range) {
  if (range === 'all') return null;
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const d = now.getDate();
  let start, end;
  if (range === 'today') {
    start = new Date(y, m, d, 0, 0, 0);
    end = new Date(y, m, d, 23, 59, 59, 999);
  } else if (range === 'week') {
    const dayOfWeek = now.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    start = new Date(y, m, d + mondayOffset, 0, 0, 0);
    end = new Date(y, m, d + mondayOffset + 6, 23, 59, 59, 999);
  } else if (range === 'month') {
    start = new Date(y, m, 1, 0, 0, 0);
    end = new Date(y, m + 1, 0, 23, 59, 59, 999);
  } else if (range === 'quarter') {
    const qStart = Math.floor(m / 3) * 3;
    start = new Date(y, qStart, 1, 0, 0, 0);
    end = new Date(y, qStart + 3, 0, 23, 59, 59, 999);
  } else if (range === 'year') {
    start = new Date(y, 0, 1, 0, 0, 0);
    end = new Date(y, 11, 31, 23, 59, 59, 999);
  }
  return [start.getTime(), end.getTime()];
}

// 读取日历模块当前选择的时间范围（filterDate 单日 或 filterStart/filterEnd 范围）
// 返回 [startMs, endMs]；未选择时返回 null
function getCurrentRange() {
  if (filterDate) {
    // 日历选择了某一天
    const start = new Date(filterDate + 'T00:00:00');
    return [start.getTime(), start.getTime() + 24 * 3600 * 1000 - 1];
  }
  if (filterStart && filterEnd) {
    return [new Date(filterStart).getTime(), new Date(filterEnd).getTime()];
  }
  return null;
}

// 当前选中的导出范围快捷选项
let exportSelectedRange = 'all';
// 自定义起止时间（'YYYY-MM-DDTHH:mm' 字符串或 null）
let exportStartVal = null;
let exportEndVal = null;

// Date → 'YYYY-MM-DDTHH:mm'（本地时间）
function fmtLocal(d) {
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${yy}-${mm}-${dd}T${hh}:${mi}`;
}

// '2026-08-21T10:00' → '2026-08-21 10:00'；空值显示"选择"
function fmtExportTime(str) {
  if (!str) return '选择';
  return str.replace('T', ' ');
}

// 渲染一行时间（'start' | 'end'）
function renderExportTime(which) {
  const isStart = which === 'start';
  const val = isStart ? exportStartVal : exportEndVal;
  const valueEl = document.getElementById(isStart ? 'exportStartValue' : 'exportEndValue');
  const rowEl = document.getElementById(isStart ? 'exportRowStart' : 'exportRowEnd');
  const picker = document.getElementById(isStart ? 'exportStartPicker' : 'exportEndPicker');
  valueEl.textContent = fmtExportTime(val);
  valueEl.classList.toggle('placeholder', !val);
  rowEl.classList.toggle('has-value', !!val);
  picker.value = val || '';
}

function updateExportHint() {
  const hint = document.getElementById('exportRangeHint');
  const active = exportSelectedRange;

  if (active === 'all') {
    hint.textContent = `将导出全部数据（${records.length} 条记录，${intervals.length} 条耗时统计）`;
    return;
  }

  // 自定义模式
  if (active === 'custom') {
    const s = exportStartVal, e = exportEndVal;
    if (s && e) {
      const cnt = records.filter(r => {
        const t = new Date(r.ts).getTime();
        return t >= new Date(s).getTime() && t <= new Date(e).getTime();
      }).length;
      hint.textContent = `范围内 ${cnt} 条记录`;
    } else {
      hint.textContent = '请选择起止时间';
    }
    return;
  }

  // 当前（日历模块已选范围）
  if (active === 'current') {
    const rng = getCurrentRange();
    if (!rng) {
      hint.textContent = '日历模块未选择时间范围';
      return;
    }
    const cnt = records.filter(r => {
      const t = new Date(r.ts).getTime();
      return t >= rng[0] && t <= rng[1];
    }).length;
    hint.textContent = `当前范围：${fmtLocal(new Date(rng[0])).slice(0,10)} ~ ${fmtLocal(new Date(rng[1])).slice(0,10)}（${cnt} 条记录）`;
    return;
  }

  // 快捷选项
  const rng = getExportRange(active);
  if (!rng) return;
  const sDate = new Date(rng[0]);
  const eDate = new Date(rng[1]);
  const labels = { today:'本日', week:'本周', month:'本月', quarter:'本季', year:'本年' };
  const cnt = records.filter(r => {
    const t = new Date(r.ts).getTime();
    return t >= rng[0] && t <= rng[1];
  }).length;
  hint.textContent = `${labels[active]}：${fmtLocal(sDate).slice(0,10)} ~ ${fmtLocal(eDate).slice(0,10)}（${cnt} 条记录）`;
}

function openExportModal() {
  // 日历模块已选择范围时默认选中"当前"，否则默认"全部"
  const hasCalendarRange = !!getCurrentRange();
  exportSelectedRange = hasCalendarRange ? 'current' : 'all';
  exportStartVal = null;
  exportEndVal = null;
  document.querySelectorAll('.eqf-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.eqf-btn[data-erange="${exportSelectedRange}"]`).classList.add('active');
  if (exportSelectedRange === 'current') {
    const rng = getCurrentRange();
    if (rng) {
      exportStartVal = fmtLocal(new Date(rng[0]));
      exportEndVal = fmtLocal(new Date(rng[1]));
    }
  }
  renderExportTime('start');
  renderExportTime('end');
  updateExportHint();
  document.getElementById('exportMask').classList.add('show');
}

function closeExportModal() {
  document.getElementById('exportMask').classList.remove('show');
}

// 快捷选项点击
document.querySelector('.export-qf-grid').addEventListener('click', e => {
  const btn = e.target.closest('.eqf-btn');
  if (!btn) return;
  document.querySelectorAll('.eqf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  exportSelectedRange = btn.dataset.erange;
  if (exportSelectedRange === 'all') {
    exportStartVal = null;
    exportEndVal = null;
  } else if (exportSelectedRange === 'current') {
    const rng = getCurrentRange();
    if (rng) {
      exportStartVal = fmtLocal(new Date(rng[0]));
      exportEndVal = fmtLocal(new Date(rng[1]));
    } else {
      exportStartVal = null;
      exportEndVal = null;
    }
  } else {
    const rng = getExportRange(exportSelectedRange);
    if (rng) {
      exportStartVal = fmtLocal(new Date(rng[0]));
      exportEndVal = fmtLocal(new Date(rng[1]));
    }
  }
  renderExportTime('start');
  renderExportTime('end');
  updateExportHint();
});

// 开始/结束时间行：点击整行弹出原生时间选择器，选完显示为文字
['start', 'end'].forEach(which => {
  const isStart = which === 'start';
  const picker = document.getElementById(isStart ? 'exportStartPicker' : 'exportEndPicker');
  const clearBtn = document.getElementById(isStart ? 'exportStartClear' : 'exportEndClear');

  // 点击 → 切换为自定义模式（取消快捷按钮高亮），透明输入框会弹出原生选择器
  picker.addEventListener('click', () => {
    if (exportSelectedRange !== 'custom') {
      exportSelectedRange = 'custom';
      document.querySelectorAll('.eqf-btn').forEach(b => b.classList.remove('active'));
      updateExportHint();
    }
  });

  // 选择完成 → 保存值并更新文字显示
  picker.addEventListener('change', () => {
    const v = picker.value;
    if (isStart) exportStartVal = v || null;
    else exportEndVal = v || null;
    renderExportTime(which);
    updateExportHint();
  });

  // 清除按钮
  clearBtn.addEventListener('click', e => {
    e.stopPropagation();
    picker.value = '';
    if (isStart) exportStartVal = null;
    else exportEndVal = null;
    if (exportSelectedRange !== 'custom') {
      exportSelectedRange = 'custom';
      document.querySelectorAll('.eqf-btn').forEach(b => b.classList.remove('active'));
    }
    renderExportTime(which);
    updateExportHint();
  });
});

// 取消按钮
document.getElementById('exportCancel').addEventListener('click', closeExportModal);

// 点击遮罩关闭
document.getElementById('exportMask').addEventListener('click', e => {
  if (e.target.id === 'exportMask') closeExportModal();
});

// 确认导出
document.getElementById('exportConfirm').addEventListener('click', () => {
  let startMs = null, endMs = null;

  if (exportSelectedRange === 'all') {
    // 全部数据
  } else if (exportSelectedRange === 'current') {
    const rng = getCurrentRange();
    if (!rng) { toast('请先在日历中选择时间范围'); return; }
    startMs = rng[0];
    endMs = rng[1];
  } else if (exportSelectedRange === 'custom') {
    const s = exportStartVal;
    const e = exportEndVal;
    if (!s || !e) { toast('请选择起止时间'); return; }
    startMs = new Date(s).getTime();
    endMs = new Date(e).getTime();
    if (startMs > endMs) { toast('开始时间不能晚于结束时间'); return; }
  } else {
    const rng = getExportRange(exportSelectedRange);
    if (rng) { startMs = rng[0]; endMs = rng[1]; }
  }

  // 筛选数据
  const filteredRecords = (startMs === null)
    ? records
    : records.filter(r => {
        const t = new Date(r.ts).getTime();
        return t >= startMs && t <= endMs;
      });
  const filteredIntervals = (startMs === null)
    ? intervals
    : intervals.filter(iv => {
        if (!iv.ts) return true;  // 无时间戳的耗时统计保留
        const t = new Date(iv.ts).getTime();
        return t >= startMs && t <= endMs;
      });

  if (filteredRecords.length === 0 && filteredIntervals.length === 0) {
    toast('选定范围内没有数据');
    return;
  }

  // 生成 CSV
  const BOM = '\uFEFF';
  const rows = [];
  rows.push('事件记录');
  rows.push('时间,内容,结束时间,持续时长');
  filteredRecords.forEach(r => {
    const ts = fmtTime(r.ts);
    const content = '"' + (r.content || '').replace(/"/g, '""') + '"';
    const endTs = r.endTs ? fmtTime(r.endTs) : '';
    const dur = r.endTs ? fmtDurationMs(Math.abs(new Date(r.endTs) - new Date(r.ts))) : '';
    rows.push(`${ts},${content},${endTs},${dur}`);
  });
  rows.push('');
  rows.push('耗时统计');
  rows.push('类目,描述,时长,备注');
  filteredIntervals.forEach(iv => {
    const cat = iv.category || '其他';
    const text = '"' + (iv.text || '').replace(/"/g, '""') + '"';
    const dur = fmtDurationMs(iv.duration);
    const remark = '"' + (iv.remark || '').replace(/"/g, '""') + '"';
    rows.push(`${cat},${text},${dur},${remark}`);
  });
  const csv = BOM + rows.join('\n');

  // 文件名带范围后缀
  let suffix = '-all';
  if (startMs !== null) {
    const s = new Date(startMs);
    const e = new Date(endMs);
    const f = dd => `${dd.getFullYear()}${String(dd.getMonth()+1).padStart(2,'0')}${String(dd.getDate()).padStart(2,'0')}`;
    suffix = `-${f(s)}-${f(e)}`;
  }
  const fileName = `memo${suffix}.csv`;
  downloadFile(new Blob([csv], { type: 'text/csv;charset=utf-8' }), fileName);

  closeExportModal();
  toast(`已导出 ${filteredRecords.length} 条记录，${filteredIntervals.length} 条耗时统计`);
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('文件过大'); e.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.records || !Array.isArray(data.records)) throw new Error('格式无效');
      showConfirm('导入数据', `将覆盖当前数据（${data.records.length} 条记录，${data.intervals?.length || 0} 条耗时），确定导入？`, () => {
        records = data.records.map(r => ({
          id: r.id || uid(), content: String(r.content||'').slice(0,500),
          ts: r.ts || now(), endTs: r.endTs || void 0
        }));
        intervals = (data.intervals || []).map(iv => ({
          text: String(iv.text||'').slice(0,100), duration: Number(iv.duration)||0,
          category: String(iv.category||'其他').slice(0,10),
          remark: String(iv.remark||'').slice(0,30), ts: iv.ts || now(),
          idA: iv.idA || '', idB: iv.idB || null
        })).filter(iv => iv.idA);
        phrases = data.phrases || [];
        categories = (data.categories && data.categories.length) ? data.categories : [...DEFAULT_CATEGORIES];
        save();
        rebuildUsed();
        drillCat = null;
        filterCategory = null; filterPeriod = null;
        compareMode = false;
        document.getElementById('compareToggle').classList.remove('active');
        document.getElementById('compareBar').style.display = 'none';
        document.body.classList.remove('period-prev');
        renderPhrases();
        initPhraseDrag();
        renderRecords();
        renderCalendar();
        renderStats();
        toast('数据已导入');
      });
    } catch {
      showConfirm('导入失败', '文件格式无效，请选择正确的备份文件', null, true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

load();
recById = {}; records.forEach(r => { recById[r.id] = r; });
// Fix corrupted categories data from previous bug
if (!categories.length || categories.some(c => !c || typeof c !== 'string')) {
  categories = [...DEFAULT_CATEGORIES];
  save();
}
rebuildUsed();
renderPhrases();
initPhraseDrag();
renderRecords();
renderCalendar();
renderInterval();
renderStats();
document.getElementById('noteInput').focus();
